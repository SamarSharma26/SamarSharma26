name: Update Animated GitHub Profile Cards

on:
  schedule:
    - cron: "30 1 * * *" # Runs daily at 07:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch contributions & render animated SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_readme_cards.py

      - name: Commit updated SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/
          git diff --staged --quiet || git commit -m "chore: refresh animated profile cards"
          git push
