<svg xmlns="http://www.w3.org/2000/svg" width="280" height="190" viewBox="0 0 280 190">
      
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes riseIn {
        0% { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.4); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes growBar {
        0% { transform: scaleY(0); }
        100% { transform: scaleY(1); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.35); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
      
      
    </style>
    
      <rect x="1" y="1" width="278" height="188" rx="16" fill="#DC2626"
            style="opacity:0;animation:riseIn 0.45s ease forwards 1.15s" />
      <text x="24" y="38" class="mono" font-size="12" font-weight="700" fill="#FFFFFF" opacity="0.85">CREATE ↗</text>
      <text x="24" y="114" class="serif" font-size="44" font-weight="700" fill="#FFFFFF">YT</text>
      <text x="24" y="146" class="sans" font-size="16" font-weight="600" fill="#FFFFFF">TheSamarCode</text>
      <text x="24" y="168" class="mono" font-size="11" fill="#FFFFFF" opacity="0.85">Tutorials &amp; Dev Videos</text>
    </svg>